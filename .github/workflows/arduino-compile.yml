name: Arduino compile

on:
  push:
  pull_request:

jobs:
  leonardo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned AVR core and Ethernet library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install Ethernet@2.0.2

      - name: Install this repository as an Arduino library
        run: |
          mkdir -p "$HOME/Arduino/libraries/HIDPowerDevice"
          cp -R src examples library.properties keywords.txt "$HOME/Arduino/libraries/HIDPowerDevice/"

      - name: Compile original UPS example for Leonardo
        run: |
          arduino-cli compile --warnings all --fqbn arduino:avr:leonardo \
            "$HOME/Arduino/libraries/HIDPowerDevice/examples/UPS"

      - name: Compile Ethernet simulator for Leonardo and enforce flash budget
        run: |
          set +e
          out=$(arduino-cli compile --warnings all --fqbn arduino:avr:leonardo \
            "$HOME/Arduino/libraries/HIDPowerDevice/examples/UPS_Simulator_Ethernet" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 0
          used=$(printf '%s\n' "$out" | sed -n 's/^Sketch uses \([0-9][0-9]*\) bytes.*/\1/p' | head -n1)
          test -n "$used"
          test "$used" -le 28160
